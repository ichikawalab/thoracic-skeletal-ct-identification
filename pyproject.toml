[project]
name = "thoracic-skeletal-ct-identification"
version = "0.1.0"
description = "CT-based individual identification using radiomic shape features of the sternum and thoracic vertebrae (NLST)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shota Ichikawa" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydicom>=2.4,<3",
    "numpy",
    "pandas",
    "nibabel>=5.4.2",
    "simpleitk>=2.5.6",
    "dcm2niix==1.0.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12,<1",
]
# Matching and evaluation only; kept out of the package dependencies so that env-seg, which installs this
# package for common.provenance, does not pull them in.
analysis = [
    "scipy",
    "matplotlib",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
